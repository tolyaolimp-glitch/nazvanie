<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>План на день</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #08080a;
      --panel: rgba(19, 19, 24, 0.82);
      --panel-strong: rgba(30, 12, 16, 0.92);
      --text: #f8f4f5;
      --muted: #b8a9ad;
      --red: #e11931;
      --red-soft: #861322;
      --line: rgba(255, 255, 255, 0.12);
      --ok: #45d483;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      background:
        radial-gradient(circle at 15% 10%, rgba(225, 25, 49, 0.38), transparent 34%),
        linear-gradient(135deg, #020203 0%, #16060a 48%, #3d0610 100%);
      color: var(--text);
    }

    main {
      width: min(960px, calc(100% - 32px));
      margin: 0 auto;
      padding: 40px 0;
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 5vw, 58px);
      line-height: 1;
    }

    .date {
      color: var(--muted);
      font-size: 15px;
      margin-top: 10px;
    }

    .shell {
      border: 1px solid var(--line);
      background: var(--panel);
      backdrop-filter: blur(20px);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.42);
    }

    form {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      padding: 18px;
      background: var(--panel-strong);
      border-bottom: 1px solid var(--line);
    }

    input {
      min-width: 0;
      height: 46px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 14px;
      background: rgba(0, 0, 0, 0.38);
      color: var(--text);
      font: inherit;
      outline: none;
    }

    input:focus {
      border-color: rgba(225, 25, 49, 0.82);
      box-shadow: 0 0 0 3px rgba(225, 25, 49, 0.18);
    }

    button {
      height: 46px;
      border: 0;
      border-radius: 8px;
      padding: 0 18px;
      font: 700 15px/1 Inter, "Segoe UI", Arial, sans-serif;
      color: white;
      background: linear-gradient(135deg, var(--red), #8c0717);
      cursor: pointer;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
    }

    .filters {
      display: flex;
      gap: 8px;
    }

    .filter {
      height: 38px;
      padding: 0 14px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--muted);
      border: 1px solid var(--line);
      font-weight: 700;
    }

    .filter.active {
      background: #f6f1f2;
      color: #151114;
    }

    .counter {
      color: var(--muted);
      font-size: 14px;
    }

    .list {
      display: grid;
      gap: 10px;
      padding: 18px;
    }

    .task {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 14px;
      min-height: 58px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.045);
    }

    .check {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.32);
      background: transparent;
      padding: 0;
      display: grid;
      place-items: center;
    }

    .done .check {
      border-color: var(--ok);
      background: var(--ok);
      color: #07120b;
    }

    .title {
      overflow-wrap: anywhere;
      font-size: 16px;
    }

    .done .title {
      color: var(--muted);
      text-decoration: line-through;
    }

    .status {
      min-width: 96px;
      text-align: center;
      border-radius: 999px;
      padding: 7px 10px;
      color: #ffdbe0;
      background: rgba(225, 25, 49, 0.18);
      font-size: 13px;
      font-weight: 800;
    }

    .done .status {
      color: #ccffe0;
      background: rgba(69, 212, 131, 0.16);
    }

    .empty {
      padding: 34px 18px;
      text-align: center;
      color: var(--muted);
    }

    @media (max-width: 640px) {
      main {
        width: min(100% - 20px, 960px);
        padding: 24px 0;
      }

      header,
      .toolbar {
        align-items: stretch;
        flex-direction: column;
      }

      form {
        grid-template-columns: 1fr;
      }

      .filters {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
      }

      .filter {
        padding: 0 8px;
      }

      .task {
        grid-template-columns: auto 1fr;
      }

      .status {
        grid-column: 2;
        justify-self: start;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>План на день</h1>
        <div class="date" id="date"></div>
      </div>
      <div class="counter" id="summary"></div>
    </header>

    <section class="shell" aria-label="Планировщик задач">
      <form id="form">
        <input id="taskInput" autocomplete="off" placeholder="Добавить задачу на сегодня">
        <button type="submit">Добавить</button>
      </form>

      <div class="toolbar">
        <div class="filters" role="tablist" aria-label="Фильтр задач">
          <button class="filter active" type="button" data-filter="all">Все</button>
          <button class="filter" type="button" data-filter="active">В работе</button>
          <button class="filter" type="button" data-filter="done">Выполненные</button>
        </div>
        <div class="counter" id="visibleCount"></div>
      </div>

      <div class="list" id="list"></div>
    </section>
  </main>

  <script>
    const storageKey = "daily-planner-tasks";
    const form = document.querySelector("#form");
    const input = document.querySelector("#taskInput");
    const list = document.querySelector("#list");
    const filters = document.querySelectorAll(".filter");
    const summary = document.querySelector("#summary");
    const visibleCount = document.querySelector("#visibleCount");
    const date = document.querySelector("#date");

    let currentFilter = "all";
    let tasks = JSON.parse(localStorage.getItem(storageKey) || "[]");

    if (tasks.length === 0) {
      tasks = [
        { id: crypto.randomUUID(), title: "Разобрать главные дела", done: false },
        { id: crypto.randomUUID(), title: "Закрыть одну важную задачу", done: false },
        { id: crypto.randomUUID(), title: "Подвести итоги дня", done: true }
      ];
    }

    date.textContent = new Intl.DateTimeFormat("ru-RU", {
      weekday: "long",
      day: "numeric",
      month: "long"
    }).format(new Date());

    function save() {
      localStorage.setItem(storageKey, JSON.stringify(tasks));
    }

    function getVisibleTasks() {
      if (currentFilter === "done") return tasks.filter(task => task.done);
      if (currentFilter === "active") return tasks.filter(task => !task.done);
      return tasks;
    }

    function render() {
      const visibleTasks = getVisibleTasks();
      const doneCount = tasks.filter(task => task.done).length;

      summary.textContent = `${doneCount} из ${tasks.length} выполнено`;
      visibleCount.textContent = `Показано: ${visibleTasks.length}`;
      list.innerHTML = "";

      if (visibleTasks.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "В этом фильтре пока нет задач";
        list.append(empty);
        return;
      }

      visibleTasks.forEach(task => {
        const item = document.createElement("article");
        item.className = `task${task.done ? " done" : ""}`;

        const check = document.createElement("button");
        check.className = "check";
        check.type = "button";
        check.setAttribute("aria-label", task.done ? "Вернуть в работу" : "Отметить выполненной");
        check.textContent = task.done ? "✓" : "";
        check.addEventListener("click", () => {
          task.done = !task.done;
          save();
          render();
        });

        const title = document.createElement("div");
        title.className = "title";
        title.textContent = task.title;

        const status = document.createElement("div");
        status.className = "status";
        status.textContent = task.done ? "Выполнено" : "В работе";

        item.append(check, title, status);
        list.append(item);
      });
    }

    form.addEventListener("submit", event => {
      event.preventDefault();
      const title = input.value.trim();
      if (!title) return;

      tasks.unshift({ id: crypto.randomUUID(), title, done: false });
      input.value = "";
      save();
      render();
    });

    filters.forEach(button => {
      button.addEventListener("click", () => {
        currentFilter = button.dataset.filter;
        filters.forEach(filter => filter.classList.toggle("active", filter === button));
        render();
      });
    });

    render();
  </script>
</body>
</html>
